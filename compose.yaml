services:
  kairos:
    image: kairos:latest
    container_name: kairos
    restart: "no"
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - 8000:8000
    env_file:
      - ./env/.env
    depends_on:
      psql:
        condition: 
          service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .venv/
            - .evn/
            - __pycache__/
            - .git/
            - .mypy_cache/
            - pytest_cache/
            - .ruff_cache/
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml
  psql:
    image: postgres:18-alpine
    env_file:
      - ./env/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    env_file:
      - ./env/pgadmin.env
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      psql:
        condition: service_healthy
volumes:
  postgres_data:
  pgadmin_data:



  